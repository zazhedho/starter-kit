version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errorlint
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: var-naming
        # An application has no public API: a missing comment on an exported
        # name is excluded below, but a comment that exists must start with the
        # name it documents.
        - name: exported
    dupl:
      threshold: 80
    misspell:
      locale: US
  exclusions:
    rules:
      - linters:
          - revive
        text: "should have comment or be unexported"
      - linters:
          - misspell
        text: "`thn` is a misspelling of `then`"
      - path: _test\.go
        linters:
          - noctx
          - dupl

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Import groups: standard library, third party, then this module.
      local-prefixes:
        - starter-kit
